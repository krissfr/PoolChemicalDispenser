substitutions:
  name: poolchemicaldispenser
  author: krissfr
  version: 2.0.0

esphome:
  name: $name
  friendly_name: PoolChemicalDispenser
  project:
    name: "$author.$name"
    version: "$version"
  on_boot:
    priority: 800.0 # Exécuté tôt au démarrage
    then:
      - lambda: |-
          id(dlc32_board_id).set_xstep(Xstep);
          id(dlc32_board_id).set_ystep(Ystep);
          id(dlc32_board_id).set_zstep(Zstep);
          id(dlc32_board_id).set_step_interval(id(step_interval));

esp32:
  board: esp32dev
  framework:
    type: arduino

# Composant local DLC32_stepper
external_components:
  - source:
      type: local
      path: components

dlc32_stepper:
  id: dlc32_board_id

# Enable logging
logger:
  level: WARN

# Enable Home Assistant API
api:
  encryption:
    key: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

ota:
 - platform: esphome
   password: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Poolchemicaldispenser"
    password: "xxxxxxxxxxxxxx"

captive_portal:

web_server:
  local: true
  port: 80

# Global variables
globals:
  - id: Xstep
    type: int
    restore_value: no
    initial_value: "0"
  - id: Ystep
    type: int
    restore_value: no
    initial_value: "0"
  - id: Zstep
    type: int
    restore_value: no
    initial_value: "0"
  - id: calibration_step
    type: int
    restore_value: no
    initial_value: '10000'
  - id: minimal_power_used_by_main_pump
    type: int
    restore_value: no
    initial_value: '10'

# numbers
number:
  - platform: template
    name: "Active Oxygen quantity (ml)"
    id: number_quantity_oa
    optimistic: true
    min_value: 10
    max_value: 500
    initial_value: 80
    step: 10
    mode: slider
  - platform: template
    id: number_step_oa
    optimistic: true
    internal: True
    min_value: 10
    max_value: 300
    initial_value: 210
    step: 1
    mode: slider
  - platform: template
    name: "PH+ quantity (ml)"
    id: number_quantity_php
    optimistic: true
    min_value: 10
    max_value: 500
    initial_value: 100
    step: 10
    mode: slider
  - platform: template
    id: number_step_php
    optimistic: true
    internal: True
    min_value: 10
    max_value: 300
    initial_value: 250
    step: 1
    mode: slider
  - platform: template
    name: "PH- quantity (ml)"
    id: number_quantity_phm
    optimistic: true
    min_value: 10
    max_value: 500
    initial_value: 80
    step: 10
    mode: slider
  - platform: template
    id: number_step_phm
    internal: True
    optimistic: true
    min_value: 10
    max_value: 300
    initial_value: 255
    step: 1
    mode: slider
  - platform: template
    name: "Motor Speed: time between step (ms)"
    id: step_interval
    optimistic: true
    min_value: 0.15
    max_value: 0.25
    initial_value: 0.15
    step: 0.05
    mode: slider

# Switches
switch:
  - platform: template
    name: "Active Oxygen dosing pump"
    id: pompe_oa_switch
    optimistic: true
    turn_on_action:
      - if:
          condition:
            binary_sensor.is_off: MainPump
          then:
            - logger.log:
                format: "WARNING : You can't use dosing pumps when the main pool pump is OFF (except for calibration)"
                level: WARN
            - display_menu.hide: my_graphical_display_menu
            - display.page.show: warning_page
            - delay: 3500ms
            - display_menu.show: my_graphical_display_menu
            - script.execute: splashscreen_timer
          else:
            - logger.log:
                format: "Setting Active Oxygen stepper position to %f"
                args: [ 'id(number_quantity_oa).state*id(calibration_step)/id(number_step_oa).state' ]
            - lambda: |-
                id(Xstep) = id(number_quantity_oa).state*id(calibration_step)/id(number_step_oa).state;
            - wait_until:
                lambda: 'return ( Xstep->value() == 0 );'
      - switch.turn_off: pompe_oa_switch
    turn_off_action:
      - logger.log: "Setting Active Oxygen stepper to stop state before the end of steps"
      - lambda: |-
          id(Xstep) = 0;
  - platform: template
    name: "PH+ dosing pump"
    id: pompe_php_switch
    optimistic: true
    turn_on_action:
      - if:
          condition:
            binary_sensor.is_off: MainPump
          then:
            - logger.log:
                format: "WARNING : You can't use dosing pumps when the main pool pump is OFF (except for calibration)"
                level: WARN
            - display_menu.hide: my_graphical_display_menu
            - display.page.show: warning_page
            - delay: 3500ms
            - display_menu.show: my_graphical_display_menu
            - script.execute: splashscreen_timer
          else:
            - logger.log:
                format: "Setting PH+ stepper position to %f"
                args: [ 'id(number_quantity_php).state*id(calibration_step)/id(number_step_php).state' ]
            - lambda: |-
                id(Ystep) = id(number_quantity_php).state*id(calibration_step)/id(number_step_php).state;
            - wait_until:
                lambda: 'return ( Ystep->value() == 0 );'
      - switch.turn_off: pompe_php_switch
    turn_off_action:
      - logger.log: "Setting PH+ stepper to stop state before the end of steps"
      - lambda: |-
          id(Ystep) = 0;
  - platform: template
    name: "PH- dosing pump"
    id: pompe_phm_switch
    optimistic: true
    turn_on_action:
      - if:
          condition:
            binary_sensor.is_off: MainPump
          then:
            - logger.log:
                format: "WARNING : You can't use dosing pumps when the main pool pump is OFF (except for calibration)"
                level: WARN
            - display_menu.hide: my_graphical_display_menu
            - display.page.show: warning_page
            - delay: 3500ms
            - display_menu.show: my_graphical_display_menu
            - script.execute: splashscreen_timer
          else:
            - logger.log:
                format: "Setting PH- stepper position to %f"
                args: [ 'id(number_quantity_phm).state*id(calibration_step)/id(number_step_phm).state' ]
            - lambda: |-
                id(Zstep) = id(number_quantity_phm).state*id(calibration_step)/id(number_step_phm).state;
            - wait_until:
                lambda: 'return ( Zstep->value() == 0 );'
      - switch.turn_off: pompe_phm_switch
    turn_off_action:
      - logger.log: "Setting PH- stepper to stop state before the end of steps"
      - lambda: |-
          id(Zstep) = 0;
  - platform: restart
    id: reboot_sw
    name: Restart Controleur

# Bus SPI réservé uniquement à l'écran OLED
spi:
  - id: spi_bus1
    clk_pin: GPIO33
    mosi_pin: GPIO25
    interface: any

# Screen: SSD1309, SPI version
display:
  - platform: ssd1306_spi
    spi_id: spi_bus1
    model: SSD1306_128X64
    cs_pin: GPIO26
    dc_pin: GPIO27
    reset_pin:
      number: GPIO5
      inverted: true
    id: my_ssd1306
    update_interval: 500ms
    pages:
    - id: start_page
      lambda: |-
        it.print(0, 3, id(my_title), "Pool");
        if ((id(AOlevel).state == false) || (id(PHPlevel).state == false) || (id(PHMlevel).state == false)) {
          static bool show = false;
          if (show) { it.image(55, 0, id(water_alert_outline));};
          show = !show;
        };
        it.print(0, 23, id(my_title), "Chemical");
        it.print(0, 43, id(my_title), "Dispenser");
        it.image(80, 10, id(pool_icon));
    - id: warning_page
      lambda: |-
        it.print(20, 1, id(my_title), "WARNING");
        it.print(5, 22, id(my_font), "the main pool pump");
        it.print(35, 35, id(my_font), " is OFF !");
        it.print(0, 50, id(my_font), "distribution is cancelled");

# Font police
font:
  - file: "gfonts://Roboto"
    id: my_title
    size: 18
  - file: "gfonts://Inria+Sans"
    id: my_font
    size: 12

# Menu display
graphical_display_menu:
  id: my_graphical_display_menu
  display: my_ssd1306
  font: my_font
  on_redraw:
    then:
      component.update: my_ssd1306
  active: false
  mode: rotary
  items:
    - type: menu
      text: 'Active Oxygen'
      items:
        - type: switch
          immediate_edit: true
          text: 'Active Oxy- Pump'
          on_text: 'ON'
          off_text: 'OFF'
          switch: pompe_oa_switch
        - type: number
          text: 'Volume (ml)'
          format: '%g'
          number: number_quantity_oa
        - type: menu
          text: 'Calibration'
          items:
            - type: command
              text: 'run calibration'
              on_value:
                then:
                  - script.execute: calibration_oa
            - type: number
              text: 'Qty obtained (ml)'
              format: '%g'
              number: number_step_oa
            - type: back
              text: 'Back'
        - type: label
          text: !lambda |- 
            return id(AOlevel).state ? "Tank level : normal" : "Tank level : LOW";
        - type: back
          text: 'Back'
    - type: menu
      text: 'PH+'
      items:
        - type: switch
          immediate_edit: true
          text: 'PH+ Pump'
          on_text: 'ON'
          off_text: 'OFF'
          switch: pompe_php_switch
        - type: number
          text: 'Volume (ml)'
          format: '%g'
          number: number_quantity_php
        - type: menu
          text: 'Calibration'
          items:
            - type: command
              text: 'run calibration'
              on_value:
                then:
                  - script.execute: calibration_php
            - type: number
              text: 'Qty obtained (ml)'
              format: '%g'
              number: number_step_php
            - type: back
              text: 'Back'
        - type: label
          text: !lambda |- 
            return id(PHPlevel).state ? "Tank level : normal" : "Tank level : LOW";
        - type: back
          text: 'Back'
    - type: menu
      text: 'PH-'
      items:
        - type: switch
          immediate_edit: true
          text: 'PH- Pump'
          on_text: 'ON'
          off_text: 'OFF'
          switch: pompe_phm_switch
        - type: number
          text: 'Volume (ml)'
          format: '%g'
          number: number_quantity_phm
        - type: menu
          text: 'Calibration'
          items:
            - type: command
              text: 'run calibration'
              on_value:
                then:
                  - script.execute: calibration_phm
            - type: number
              text: 'Qty obtained (ml)'
              format: '%g'
              number: number_step_phm
            - type: back
              text: 'Back'
        - type: label
          text: !lambda |- 
            return id(PHMlevel).state ? "Tank level : normal" : "Tank level : LOW";
        - type: back
          text: 'Back'
    - type: menu
      text: 'Main pool pump'
      items:
        - type: label
          text: !lambda |-
            return ("Main pump: " + String(id(MainPump).state ? "ON":"OFF")).c_str() ;
        - type: label
          text: !lambda |-
            return ("Power usage: " + String(id(power_channel_a).state) + " W").c_str() ;
        - type: label
          text: !lambda |-
            return ("Energy (today): " + String(id(energy_channel_a).state) + " kWh").c_str() ;
        - type: back
          text: 'Back'
    - type: menu
      text: 'System'
      items:
        - type: label
          text: !lambda |-
            return "${name}";
        - type: label
          text: !lambda |-
            return ("version: ${version}");
        - type: label
          text: !lambda |-
            if (id(wifi_component).is_connected() && !id(wifi_component).get_ip_addresses().empty()) {
              char buf[16];
              id(wifi_component).get_ip_addresses()[0].str_to(buf);
              return "IP: " + std::string(buf);
            }
            return "IP: Non connecte";
        - type: number
          text: 'Dosing speed (ms)'
          format: '%.1f'
          number: step_interval
        - type: switch
          immediate_edit: true
          off_text: 'Clic to reboot'
          text: 'Reboot'
          switch: reboot_sw
        - type: back
          text: 'Back'

# I2C
i2c:
  id: i2c1
  sda: GPIO0
  scl: GPIO4

# Current sensors
ads1115:
  - address: 0x48
    id: ads1
    i2c_id: i2c1
    continuous_mode: true

sensor:
  - platform: rotary_encoder
    name: "Rotary Encoder"
    internal: True
    pin_a:
      number: GPIO19
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO18
      mode:
        input: true
        pullup: true
    filters:
      debounce: 30ms
    on_anticlockwise:
      - display_menu.up: my_graphical_display_menu
    on_clockwise:
      - display_menu.down: my_graphical_display_menu
  - platform: ads1115
    ads1115_id: ads1
    multiplexer: 'A0_A1'
    gain: 1.024
    name: "Channel A"
    force_update: true
    id: Channel_A
    internal: true
  - platform: ct_clamp
    sensor: Channel_A
    name: "Measured Current Channel A"
    update_interval: 5s
    accuracy_decimals: 2
    filters:
      - calibrate_linear:
          - 0 -> 0
          - 1 -> 50   
    id: current_channel_A
  - platform: template
    name: power channel a
    id: power_channel_a
    unit_of_measurement: W
    lambda: return id(current_channel_A).state ;
    filters:
      - multiply: 235
  - platform: total_daily_energy
    name: energy_channel_a
    id: energy_channel_a
    power_id: power_channel_a
    unit_of_measurement: kWh
    device_class: energy    
    filters:
      - multiply: .001

time:
  - platform: homeassistant
    id: homeassistant_time

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO23
      mode:
        input: true
        pullup: true
    name: enter
    internal: True
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - if:
          condition:
            display_menu.is_active: my_graphical_display_menu
          then:
            - display_menu.enter: my_graphical_display_menu
          else:
            - display_menu.show:  my_graphical_display_menu
      - script.execute: splashscreen_timer
  - platform: gpio
    pin:
      number: GPIO34
      mode:
        input: true
        pullup: false
    id: AOlevel
    internal: true
    device_class: problem 
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
  - platform: gpio
    pin:
      number: GPIO35
      mode:
        input: true
        pullup: false
    name: "PH+ low level in tank"
    id: PHPlevel
    internal: true
    device_class: battery
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
  - platform: gpio
    pin:
      number: GPIO36
      mode:
        input: true
        pullup: false
    name: "PH- low level in tank"
    id: PHMlevel
    internal: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
  - platform: template
    name: "Main Pump status"
    id: MainPump
    lambda: |-
      return true; //return id(power_channel_a).state >= minimal_power_used_by_main_pump->value();

text_sensor:
  - platform: template
    name: Active Oxygen tank level
    lambda: |-
      if (id(AOlevel).state) {
        return {"normal"};
      } else {
        return {"LOW"};
      }
  - platform: template
    name: PH+ tank level
    lambda: |-
      if (id(PHPlevel).state) {
        return {"normal"};
      } else {
        return {"LOW"};
      }
  - platform: template
    name: PH- tank level
    lambda: |-
      if (id(PHMlevel).state) {
        return {"normal"};
      } else {
        return {"LOW"};
      }

script:
  - id: splashscreen_timer
    mode: restart
    then:
      - delay: 2 min
      - display_menu.show_main: my_graphical_display_menu
      - display_menu.hide: my_graphical_display_menu
      - display.page.show: start_page
  - id: calibration_oa
    then:
      - logger.log:
          format: "Run calibration for Active Oxygen stepper, send %d steps."
          args: [ 'id(calibration_step)' ]
      - lambda: |-
            id(Xstep) = id(calibration_step);
      - wait_until:
          lambda: 'return ( Xstep->value() == 0 );'
  - id: calibration_php
    then:
      - logger.log:
          format: "Run calibration for PH+ stepper, send %d steps."
          args: [ 'id(calibration_step)' ]
      - lambda: |-
            id(Ystep) = id(calibration_step);
      - wait_until:
          lambda: 'return ( Ystep->value() == 0 );'
  - id: calibration_phm
    then:
      - logger.log:
          format: "Run calibration for PH- stepper, send %d steps."
          args: [ 'id(calibration_step)' ]
      - lambda: |-
            id(Zstep) = id(calibration_step);
      - wait_until:
          lambda: 'return ( Zstep->value() == 0 );'

image:
  - platform: file
    file: mdi:pool
    id: pool_icon
    resize: 50x50
    type: BINARY
  - platform: file
    file: mdi:barrel-outline
    id: water_alert_outline
    resize: 27x27
    type: BINARY
